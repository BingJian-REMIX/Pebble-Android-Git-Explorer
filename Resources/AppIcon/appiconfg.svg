<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="512" height="512" viewBox="88 112 336 336" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <!-- 前景层：坐标完全照原始设计，不做缩放位移。
         MAUI 会把前景再缩到画布 66% 安全区，所以只收紧 viewBox 到图案包围盒。
         注意：不能用 <text>，Resizetizer 处理文字会抛 HarfBuzzSharp 异常直接构建失败；
         也不能用 <g transform>，它会被忽略。字只能手画路径。 -->
    <defs>
        <linearGradient id="dosOrange" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFC107" />
            <stop offset="100%" stop-color="#F57C00" />
        </linearGradient>
    </defs>

    <!-- 背后的层叠窗口 -->
    <path d="M 100 140 L 100 380 L 340 380" fill="none" stroke="url(#dosOrange)"
          stroke-width="16" stroke-linejoin="round" opacity="0.4" />

    <!-- 前方的文件窗口 + 折角 -->
    <path d="M 140 180 L 140 420 L 380 420 L 380 260 L 300 180 Z" fill="none"
          stroke="url(#dosOrange)" stroke-width="16" stroke-linejoin="round" />
    <path d="M 300 180 L 300 260 L 380 260" fill="none"
          stroke="url(#dosOrange)" stroke-width="16" stroke-linejoin="round" />

    <!-- Git 分支 -->
    <line x1="220" y1="260" x2="220" y2="350" stroke="url(#dosOrange)"
          stroke-width="14" stroke-linecap="round" />
    <path d="M 220 320 L 270 320 L 310 280" fill="none" stroke="url(#dosOrange)"
          stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="220" cy="260" r="14" fill="#07090F" stroke="url(#dosOrange)" stroke-width="6" />
    <circle cx="220" cy="350" r="14" fill="#07090F" stroke="url(#dosOrange)" stroke-width="6" />
    <circle cx="310" cy="280" r="14" fill="#07090F" stroke="url(#dosOrange)" stroke-width="6" />

    <!-- 应用胶囊：按设计跨越窗口右边框 -->
    <rect x="230" y="330" width="180" height="64" rx="32" fill="url(#dosOrange)" />

    <!-- Git 字样（手绘路径，字高约 32，中心 x≈320） -->
    <g stroke="#07090F" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M 316 347 A 13 13 0 1 0 317 365" />
        <path d="M 317 365 L 317 357 L 307 357" />
        <line x1="328" y1="347" x2="328" y2="372" />
        <path d="M 338 339 L 338 366 Q 338 372 344 372 L 346 372" />
        <line x1="332" y1="350" x2="346" y2="350" />
    </g>
    <circle cx="328" cy="340" r="3.5" fill="#07090F" />
</svg>
